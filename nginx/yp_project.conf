server {
    listen 80;
    server_name test.unocum.kr 3.38.80.64;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name test.unocum.kr 3.38.80.64;

    ssl_certificate /etc/letsencrypt/live/test.unocum.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.unocum.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 업로드 첨부파일은 Flask /files/ 라우트로만 제공
    location = /api/upload/file {
        client_max_body_size 55m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/uploads/general_files/ {
        return 404;
    }
    location ^~ /uploads/general_files/ {
        return 404;
    }

    # PHP 실행 파일 차단 (현재 PHP 런타임 없음, 향후 오설정 대비)
    location ~* \.(php|phtml|phar)$ {
        return 404;
    }

    location /static/ {
        alias /home/ubuntu/yp_project/static/;
    }

    location /uploads/ {
        alias /home/ubuntu/yp_project/uploads/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
