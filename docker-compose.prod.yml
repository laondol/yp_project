services:
  flask_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yp_flask
    volumes:
      - .:/yp_project
      - uploads_data:/yp_project/uploads
    working_dir: /yp_project
    ports:
      - "127.0.0.1:5000:5000"
    env_file: .env
    environment:
      - RAG_URL=http://yp_rag:8001
    depends_on:
      postgres:
        condition: service_healthy
      rag:
        condition: service_started
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yp_scheduler
    volumes:
      - .:/yp_project
      - uploads_data:/yp_project/uploads
    working_dir: /yp_project
    env_file: .env
    environment:
      - RAG_URL=http://yp_rag:8001
    command: ["python", "scheduler.py"]
    depends_on:
      postgres:
        condition: service_healthy
      rag:
        condition: service_started
    restart: always

  rag:
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: yp_rag
    working_dir: /yp_project/yp_rag
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://yp_dev:yp_dev_pass_2026@postgres:5432/yp_local
      - RAG_API_KEY=yp_rag_secret_2026
    volumes:
      - .:/yp_project
      - rag_data:/yp_project/yp_rag/chroma_data
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 8001)); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  postgres:
    image: postgis/postgis:16-3.5-alpine
    container_name: yp_postgres
    environment:
      POSTGRES_USER: yp_dev
      POSTGRES_PASSWORD: yp_dev_pass_2026
      POSTGRES_DB: yp_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yp_dev -d yp_local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  uploads_data:
  rag_data:
