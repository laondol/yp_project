services:
  flask_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yp_flask
    volumes:
      - .:/yp_project
      - uploads_data:/yp_project/uploads
    working_dir: /yp_project
    ports:
      - "127.0.0.1:5000:5000"
    env_file: .env
    environment:
      - RAG_URL=http://yp_rag:8001
    depends_on:
      - postgres
      - rag
    restart: always

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yp_scheduler
    volumes:
      - .:/yp_project
      - uploads_data:/yp_project/uploads
    working_dir: /yp_project
    env_file: .env
    environment:
      - RAG_URL=http://yp_rag:8001
    command: ["python", "scheduler.py"]
    depends_on:
      - postgres
      - rag
    restart: always

  rag:
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: yp_rag
    working_dir: /yp_project/yp_rag
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DATABASE_URL=postgresql://yp_dev:yp_dev_pass_2026@postgres:5432/yp_local
      - RAG_API_KEY=yp_rag_secret_2026
    volumes:
      - rag_data:/yp_project/yp_rag/chroma_data
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: yp_postgres
    environment:
      POSTGRES_USER: yp_dev
      POSTGRES_PASSWORD: yp_dev_pass_2026
      POSTGRES_DB: yp_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
  uploads_data:
  rag_data:
