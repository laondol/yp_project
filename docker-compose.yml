services:
  flask_app:
    build: .
    container_name: yp_flask
    volumes:
      - .:/yp_project
    working_dir: /yp_project
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - RAG_URL=http://yp_rag:8001
    depends_on:
      - postgres
      - rag
    restart: always

  scheduler:
    build: .
    container_name: yp_scheduler
    volumes:
      - .:/yp_project
    working_dir: /yp_project
    env_file: .env
    environment:
      - RAG_URL=http://yp_rag:8001
    command: ["python", "scheduler.py"]
    depends_on:
      - postgres
      - rag
    restart: always

  react_frontend:
    image: node:20-alpine
    container_name: yp_react
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: >
      sh -c "npm install &&
             npm run dev -- --host"
    environment:
      - VITE_API_TARGET=http://yp_flask:5000
    ports:
      - "5173:5173"
    depends_on:
      - flask_app
    restart: always

  postgres:
    image: postgis/postgis:16-3.5-alpine
    container_name: yp_postgres
    environment:
      POSTGRES_USER: yp_dev
      POSTGRES_PASSWORD: yp_dev_pass_2026
      POSTGRES_DB: yp_local
    ports:
      - "6432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  rag:
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: yp_rag
    working_dir: /yp_project/yp_rag
    environment:
      - DATABASE_URL=postgresql://yp_dev:yp_dev_pass_2026@postgres:5432/yp_local
      - RAG_API_KEY=yp_rag_secret_2026
    volumes:
      - .:/yp_project
      - rag_data:/yp_project/yp_rag/chroma_data
    depends_on:
      - postgres
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: yp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@unocum.kr
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
  rag_data:
