services:
  flask_app:
    build: .
    container_name: yp_flask
    volumes:
      - .:/yp_project
    working_dir: /yp_project
    ports:
      - "127.0.0.1:8080:5000"
    env_file: .env
    environment:
      - RAG_URL=http://yp_rag:8001
      - TZ=Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
      rag:
        condition: service_started
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  scheduler:
    build: .
    container_name: yp_scheduler
    volumes:
      - .:/yp_project
    working_dir: /yp_project
    env_file: .env
    environment:
      - RAG_URL=http://yp_rag:8001
      - TZ=Asia/Seoul
    command: ["python", "scheduler.py"]
    depends_on:
      postgres:
        condition: service_healthy
      rag:
        condition: service_started
    restart: always

  moderation_worker:
    build: .
    container_name: yp_moderation_worker
    volumes:
      - .:/yp_project
    working_dir: /yp_project
    env_file: .env
    environment:
      - RAG_URL=http://yp_rag:8001
      - TZ=Asia/Seoul
    command: ["python", "services/ai_moderation_worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
      rag:
        condition: service_started
      flask_app:
        condition: service_started
    restart: always

  react_frontend:
    image: node:20-alpine
    container_name: yp_react
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: >
      sh -c "npm install &&
             npm run dev -- --host"
    environment:
      - VITE_API_TARGET=http://yp_flask:5000
    ports:
      - "5173:5173"
    depends_on:
      flask_app:
        condition: service_started
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgis/postgis:16-3.5-alpine
    container_name: yp_postgres
    environment:
      POSTGRES_USER: yp_dev
      POSTGRES_PASSWORD: yp_dev_pass_2026
      POSTGRES_DB: yp_local
      TZ: Asia/Seoul
    ports:
      - "6432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yp_dev -d yp_local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rag:
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: yp_rag
    working_dir: /yp_project/yp_rag
    environment:
      - DATABASE_URL=postgresql://yp_dev:yp_dev_pass_2026@postgres:5432/yp_local
      - RAG_API_KEY=yp_rag_secret_2026
      - TZ=Asia/Seoul
    volumes:
      - .:/yp_project
      - rag_data:/yp_project/yp_rag/chroma_data
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 8001)); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  pgadmin:
    image: dpage/pgadmin4
    container_name: yp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@unocum.kr
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  rag_data:
